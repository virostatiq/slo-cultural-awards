[project]
name = "kulturne-nagrade"
version = "0.1.0"
description = "Dataset and analysis of Slovenian cultural awards: winners and juries, 1949 to today."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Marko Plahuta" }]
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
network = [
    "adjusttext>=1.4.0",
    "gensim>=4.4.0",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
